name: Проверка демо

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node --test
      - run: |
          node demo/preview.mjs > demo-output.md
          diff -u docs/demo-report.md demo-output.md
          cat demo-output.md >> "$GITHUB_STEP_SUMMARY"
